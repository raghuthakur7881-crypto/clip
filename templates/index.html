<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipboard Vault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">


  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal clipboard manager</p>
          <h1>Clipboard Vault</h1>
        </div>
      </header>

      <main class="layout">
        <section class="panel save-panel">
          <h2>Save a copied message</h2>

          <form id="saveForm">
            <textarea
              id="clipboardText"
              rows="8"
              placeholder="Paste or type text here..."
            ></textarea>

            <div class="button-row">
              <button type="submit" class="primary">Save text</button>
              <button type="button" id="readClipboardBtn" class="secondary">
                Save current clipboard
              </button>
            </div>
          </form>
        </section>

        <section class="panel history-panel">
          <div class="history-header">
            <h2>Saved items</h2>
            <button type="button" id="showAllBtn" class="ghost">Show all</button>
          </div>

          <div class="filters">
            <label>
              <span>Filter by date</span>
              <input type="date" id="dateFilter" />
            </label>

            <label>
              <span>Search text</span>
              <input type="search" id="searchInput" placeholder="Search saved text" />
            </label>
          </div>

          <div id="entriesList" class="entries-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}");
  }
</script>

  </body>
</html>
